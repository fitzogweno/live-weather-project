
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A live weather dashboard powered by Open-Meteo." />
  <title>SkyCast | Live Weather</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1d4ed8, #38bdf8);
      color: #fff;
      padding: 40px 20px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      margin-bottom: 10px;
    }

    header p {
      color: #dbeafe;
      line-height: 1.6;
    }

    .search-card,
    .weather-card {
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    form {
      display: flex;
      gap: 12px;
    }

    input {
      min-width: 0;
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      box-shadow: 0 0 0 3px #93c5fd;
    }

    button {
      padding: 14px 20px;
      background: #fbbf24;
      color: #172554;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #fcd34d;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      line-height: 1.6;
    }

    .error {
      color: #fecaca;
      background: rgba(127, 29, 29, 0.35);
      border-radius: 10px;
      padding: 12px;
    }

    .loading {
      color: #fef3c7;
      font-weight: bold;
    }

    .weather-card {
      margin-top: 24px;
      text-align: center;
    }

    .weather-card[hidden] {
      display: none;
    }

    .location {
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .condition {
      color: #dbeafe;
      margin-bottom: 18px;
    }

    .weather-icon {
      font-size: 4rem;
      margin-bottom: 8px;
    }

    .temperature {
      font-size: clamp(3.5rem, 12vw, 5rem);
      font-weight: bold;
      margin-bottom: 24px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .detail {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 18px 8px;
    }

    .detail span {
      display: block;
      color: #dbeafe;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .detail strong {
      font-size: 1.15rem;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: #dbeafe;
      font-size: 0.85rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 28px 14px;
      }

      .search-card,
      .weather-card {
        padding: 18px;
      }

      form {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>☀️ SkyCast</h1>
      <p>Your live weather, wherever you are.</p>
    </header>

    <section class="search-card">
      <form id="weather-form">
        <input
          type="text"
          id="city-input"
          placeholder="Enter a city, e.g. London"
          aria-label="City name"
          required
        />
        <button type="submit" id="search-button">
          Get Weather
        </button>
      </form>

      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <section class="weather-card" id="weather-card" hidden>
      <h2 class="location" id="location"></h2>
      <div class="weather-icon" id="weather-icon"></div>
      <p class="condition" id="condition"></p>
      <p class="temperature" id="temperature"></p>

      <div class="details">
        <div class="detail">
          <span>💧 Humidity</span>
          <strong id="humidity"></strong>
        </div>

        <div class="detail">
          <span>💨 Wind Speed</span>
          <strong id="wind"></strong>
        </div>

        <div class="detail">
          <span>🌡️ Feels Like</span>
          <strong id="feels-like"></strong>
        </div>
      </div>
    </section>

    <footer>
      Weather data provided by Open-Meteo · Free public API
    </footer>
  </main>

  <script>
    const form = document.getElementById("weather-form");
    const cityInput = document.getElementById("city-input");
    const searchButton = document.getElementById("search-button");
    const status = document.getElementById("status");
    const weatherCard = document.getElementById("weather-card");

    const weatherDescriptions = {
      0: ["Clear sky", "☀️"],
      1: ["Mainly clear", "🌤️"],
      2: ["Partly cloudy", "⛅"],
      3: ["Overcast", "☁️"],
      45: ["Foggy", "🌫️"],
      48: ["Depositing rime fog", "🌫️"],
      51: ["Light drizzle", "🌦️"],
      53: ["Moderate drizzle", "🌦️"],
      55: ["Dense drizzle", "🌧️"],
      61: ["Slight rain", "🌦️"],
      63: ["Moderate rain", "🌧️"],
      65: ["Heavy rain", "🌧️"],
      71: ["Slight snowfall", "🌨️"],
      73: ["Moderate snowfall", "❄️"],
      75: ["Heavy snowfall", "❄️"],
      80: ["Rain showers", "🌦️"],
      81: ["Moderate rain showers", "🌧️"],
      82: ["Violent rain showers", "⛈️"],
      95: ["Thunderstorm", "⛈️"],
      96: ["Thunderstorm with hail", "⛈️"],
      99: ["Severe thunderstorm with hail", "⛈️"]
    };

    function showStatus(message, type = "") {
      status.textContent = message;
      status.className = type;
    }

    async function getWeather(city) {
      // LOADING STATE
      showStatus("Loading...", "loading");
      weatherCard.hidden = true;
      searchButton.disabled = true;
      searchButton.textContent = "Loading...";

      try {
        // Step 1: Find the city's coordinates.
        const geoUrl =
          "https://geocoding-api.open-meteo.com/v1/search?name=" +
          encodeURIComponent(city) +
          "&count=1&language=en&format=json";

        const geoResponse = await fetch(geoUrl);

        if (!geoResponse.ok) {
          throw new Error("Could not connect to the location service.");
        }

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error(
            "City not found. Please check the spelling and try again."
          );
        }

        const place = geoData.results[0];

        // Step 2: Fetch live weather using the coordinates.
        const weatherUrl =
          "https://api.open-meteo.com/v1/forecast?" +
          `latitude=${place.latitude}` +
          `&longitude=${place.longitude}` +
          "&current=temperature_2m,relative_humidity_2m," +
          "apparent_temperature,is_day,weather_code,wind_speed_10m";

        const weatherResponse = await fetch(weatherUrl);

        if (!weatherResponse.ok) {
          throw new Error("Could not retrieve weather data. Try again.");
        }

        const weatherData = await weatherResponse.json();
        const current = weatherData.current;

        if (!current) {
          throw new Error("Weather data is currently unavailable.");
        }

        // SUCCESS STATE: Format and display the data.
        const weather = weatherDescriptions[current.weather_code]
          || ["Unknown conditions", "🌍"];

        document.getElementById("location").textContent =
          `${place.name}, ${place.country}`;

        document.getElementById("weather-icon").textContent =
          weather[1];

        document.getElementById("condition").textContent =
          weather[0];

        document.getElementById("temperature").textContent =
          `${Math.round(current.temperature_2m)}°C`;

        document.getElementById("humidity").textContent =
          `${current.relative_humidity_2m}%`;

        document.getElementById("wind").textContent =
          `${current.wind_speed_10m} km/h`;

        document.getElementById("feels-like").textContent =
          `${Math.round(current.apparent_temperature)}°C`;

        weatherCard.hidden = false;
        showStatus(
          `Last updated: ${new Date().toLocaleTimeString()}`
        );

      } catch (error) {
        // ERROR STATE
        showStatus(
          error.message ||
            "Something went wrong. Please try again.",
          "error"
        );

      } finally {
        // Always restore the search button.
        searchButton.disabled = false;
        searchButton.textContent = "Get Weather";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const city = cityInput.value.trim();

      if (!city) {
        showStatus("Please enter a city name.", "error");
        weatherCard.hidden = true;
        return;
      }

      getWeather(city);
    });
  </script>
</body>
</html>
